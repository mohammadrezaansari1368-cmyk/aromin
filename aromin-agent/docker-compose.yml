# Local stack: PostgreSQL, Redis, a one-off migration job and the API.
# Not run in the Phase 1 environment (no Docker daemon there). The worker service is
# added with the Task Engine phase.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aromin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: aromin_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aromin -d aromin_agent"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://aromin:${POSTGRES_PASSWORD}@postgres:5432/aromin_agent
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    environment: *app_env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
