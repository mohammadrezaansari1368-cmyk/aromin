<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XSI — ورود محلی</title><link rel="stylesheet" href="/src/styles.css"></head><body><main class="login-page"><section><h1 id="auth-title">ورود به XSI</h1><p>حساب مستقل محلی؛ نام کاربری یا رمز SmartX را اینجا وارد نکنید.</p><form id="local-auth"><label>نام کاربری محلی<input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64"></label><label>رمز محلی<input id="password" type="password" name="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><button id="auth-submit">ورود</button></form><p id="auth-error" role="alert"></p><p id="auth-state" role="status">در حال بررسی حساب محلی…</p></section></main><script type="module" src="/src/login-client.mjs"></script></body></html>
