<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آرومین | تخلیه دستگاه حضور و غیاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5;--panel:#ffffff;--panel2:#f8faf9;--line:#e3e8e6;--text:#1d2b27;--muted:#6b7c76;
  --brand:#0f766e;--brand2:#14b8a6;--brandSoft:#e6f4f2;--ok:#16a34a;--okSoft:#e8f6ec;--warn:#d97706;--warnSoft:#fdf3e3;
  --err:#dc2626;--errSoft:#fdecec;--info:#2563eb;--infoSoft:#e8effd;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(15,60,50,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1513;--panel:#151f1c;--panel2:#1a2622;--line:#26332f;--text:#e5eeeb;--muted:#8fa29b;
  --brandSoft:#123430;--okSoft:#12301d;--warnSoft:#33270f;--errSoft:#3a1616;--infoSoft:#142443;--shadow:none;}}
:root[data-theme="dark"]{--bg:#0e1513;--panel:#151f1c;--panel2:#1a2622;--line:#26332f;--text:#e5eeeb;--muted:#8fa29b;
  --brandSoft:#123430;--okSoft:#12301d;--warnSoft:#33270f;--errSoft:#3a1616;--infoSoft:#142443;--shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:232px;background:var(--panel);border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:18px}
.logo div small{display:block;color:var(--muted);font-size:11px;margin-top:-4px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--panel2)}
nav a.on{background:var(--brandSoft);color:var(--brand);font-weight:700}
nav svg{width:18px;height:18px;flex-shrink:0}
nav .sep{height:1px;background:var(--line);margin:10px 6px}
main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12.5px}
.conn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;background:var(--panel);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}.dot.run{background:var(--info);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:14px 16px}.kpi .v{font-size:24px;font-weight:800}.kpi .l{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:14px 16px;border-bottom:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:3px}.f label{font-size:11.5px;color:var(--muted)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand2)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--panel2);position:sticky;top:0}
tr:hover td{background:var(--panel2)}
td.num,th.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line)}
.tag.ok{background:var(--okSoft);color:var(--ok);border-color:transparent}
.tag.err{background:var(--errSoft);color:var(--err);border-color:transparent}
.tag.warn{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.tag.info{background:var(--infoSoft);color:var(--info);border-color:transparent}
.tag.brand{background:var(--brandSoft);color:var(--brand);border-color:transparent}
tr.deleted td{opacity:.5;text-decoration:line-through}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--muted);font-size:12.5px}
.devs{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.dev h3{margin:0;font-size:15.5px}.dev .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:12px 0;font-size:12.5px}
.dev .meta span{color:var(--muted)}
.dev .err{background:var(--errSoft);color:var(--err);padding:6px 10px;border-radius:8px;font-size:12px;margin-bottom:10px;word-break:break-word}
.empty{padding:40px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:16px;margin:0}
.modal .body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .body .full{grid-column:1/-1}
.modal footer{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;background:var(--panel2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.note{padding:10px 12px;border-radius:10px;font-size:12.5px;background:var(--infoSoft);color:var(--info)}
.note.warn{background:var(--warnSoft);color:var(--warn)}
.note.ok{background:var(--okSoft);color:var(--ok)}
.note.err{background:var(--errSoft);color:var(--err)}
.toast{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast div{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:360px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel2);border-radius:11px;border:1px solid var(--line);width:fit-content}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--panel);box-shadow:var(--shadow);font-weight:700;color:var(--brand)}
.neg{color:var(--err)}.pos{color:var(--ok)}
.menu-btn{display:none}
.hist{font-size:12.5px;border-right:3px solid var(--line);padding:4px 10px;margin-bottom:8px}
@media (max-width:860px){
  aside{position:fixed;right:-260px;z-index:60;transition:right .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{right:0}
  .menu-btn{display:inline-flex}
  main{padding:16px}
  .modal .body{grid-template-columns:1fr}
}
@media print{aside,.top .row,.filters,.pager,.no-print{display:none!important}main{padding:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="logo"><b>آ</b><div><strong>آرومین</strong><small>حضور و غیاب</small></div></div>
  <nav id="nav"></nav>
</aside>
<main>
  <div class="top">
    <div class="row">
      <button class="btn menu-btn" onclick="side.classList.toggle('open')">☰</button>
      <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    </div>
    <div class="row">
      <span class="conn" id="conn"><span class="dot"></span><span>در حال اتصال…</span></span>
    </div>
  </div>
  <div id="view"></div>
</main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   آرومین — ماژول تخلیه دستگاه حضور و غیاب
   ارتباط با سرویس aromin-zk (FastAPI) روی سرور دبیان.
   سرویس با SDK روی TCP:4370 به دستگاه وصل می‌شود، فقط می‌خواند و هرگز حذف نمی‌کند.
   ============================================================ */
const ICONS={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
  dev:'<rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="10" r="3.2"/><path d="M9 17h6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/>',
  hist:'<path d="M3 12a9 9 0 103-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-2.7-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 15H3a2 2 0 110-4h.1a1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009 4.6V4a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>',
  sync:'<path d="M21 12a9 9 0 01-15.5 6.3L3 16M3 12a9 9 0 0115.5-6.3L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 01-12 0zM12 18v4"/>',
  print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/>'
};
const ic=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const PAGES=[
  {id:'overview',t:'نمای کلی',s:'وضعیت دستگاه‌ها و تخلیه امروز',i:'home'},
  {id:'devices',t:'دستگاه‌ها',s:'افزودن، ویرایش و زمان‌بندی تخلیه خودکار',i:'dev'},
  {id:'records',t:'ترددهای تخلیه‌شده',s:'مشاهده، ویرایش و ثبت دستی تردد',i:'list'},
  {id:'reports',t:'گزارش‌ها',s:'کارکرد روزانه و خلاصه دوره',i:'chart'},
  {id:'people',t:'پرسنل',s:'نام‌گذاری کدهای پرسنلی دستگاه',i:'people'},
  {id:'runs',t:'سابقه تخلیه',s:'گزارش هر بار اتصال به دستگاه',i:'hist'},
  {sep:1},
  {id:'settings',t:'تنظیمات اتصال',s:'آدرس سرویس و کلید API',i:'gear'},
];
const PUNCH={0:'ورود',1:'خروج',2:'خروج موقت',3:'بازگشت',4:'ورود اضافه‌کار',5:'خروج اضافه‌کار'};
const $=(s,r=document)=>r.querySelector(s);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=(n)=>n==null?'—':Number(n).toLocaleString('fa-IR');
const store={get(k,d){try{const v=localStorage.getItem('azk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('azk_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- تاریخ شمسی ---------- */
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=gm>2?gy+1:gy;let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){let gy=jy<=979?621:1600;jy-=jy<=979?0:979;
  let days=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  gy+=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}
  gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  let gd=days+1;const sal=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;
  for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const pad=(n)=>String(n).padStart(2,'0');
const isoD=(d)=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function jdate(s,withDay){if(!s)return'—';const[y,m,d]=s.slice(0,10).split('-').map(Number);const[jy,jm,jd]=g2j(y,m,d);
  const out=`${jy}/${pad(jm)}/${pad(jd)}`;return (withDay?WD[new Date(y,m-1,d).getDay()]+' ':'')+out.replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c])}
const faDigits=(s)=>String(s??'').replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const jdt=(s)=>s?`${jdate(s)} ${faDigits(s.slice(11,16))}`:'—';
const hm=(m)=>{if(m==null)return'—';const s=m<0?'-':'';m=Math.abs(m);return faDigits(`${s}${Math.floor(m/60)}:${pad(m%60)}`)};
const hmh=(m)=>`<bdi dir="ltr">${hm(m)}</bdi>`;
function ago(s){if(!s)return'هرگز';const d=(Date.now()-new Date(s.replace(' ','T')).getTime())/1000;
  if(d<60)return'لحظاتی پیش';if(d<3600)return fa(Math.floor(d/60))+' دقیقه پیش';if(d<86400)return fa(Math.floor(d/3600))+' ساعت پیش';return jdt(s)}
function until(s){if(!s)return'—';const d=(new Date(s.replace(' ','T')).getTime()-Date.now())/1000;
  if(d<=30)return'به‌زودی';if(d<3600)return fa(Math.ceil(d/60))+' دقیقه دیگر';return fa(Math.round(d/3600))+' ساعت دیگر'}
function ranges(){const t=new Date();const[jy,jm]=g2j(t.getFullYear(),t.getMonth()+1,t.getDate());
  const gd=(a)=>{const[g1,g2,g3]=j2g(...a);return`${g1}-${pad(g2)}-${pad(g3)}`};
  const mLen=(y,m)=>m<=6?31:m<=11?30:(((y+12)%33)%4===1?30:29);
  const pm=jm===1?[jy-1,12]:[jy,jm-1];const sat=new Date(t);sat.setDate(t.getDate()-((t.getDay()+1)%7));
  const y=new Date(t);y.setDate(t.getDate()-1);
  return{today:[isoD(t),isoD(t)],yesterday:[isoD(y),isoD(y)],week:[isoD(sat),isoD(t)],
    month:[gd([jy,jm,1]),isoD(t)],prev:[gd([pm[0],pm[1],1]),gd([pm[0],pm[1],mLen(pm[0],pm[1])])]}}
const RANGE_LABELS={today:'امروز',yesterday:'دیروز',week:'این هفته',month:'این ماه',prev:'ماه قبل'};

/* ---------- تنظیمات و API ---------- */
const cfg={
  url:store.get('url',location.protocol==='file:'?'demo':(location.pathname.startsWith('/zk')?'/zk-api':'/api')),
  key:store.get('key',''),user:store.get('user','')
};
async function api(path,opt={}){
  if(cfg.url==='demo')return Demo.handle(path,opt);
  const r=await fetch(cfg.url.replace(/\/$/,'')+path,{method:opt.method||'GET',
    headers:{'Content-Type':'application/json','X-API-Key':cfg.key,'X-User':encodeURIComponent(cfg.user||'dashboard')},
    body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){let m='خطای '+r.status;try{const j=await r.json();m=typeof j.detail==='string'?j.detail:(j.detail?.[0]?.msg||m)}catch(e){}throw new Error(m)}
  return r.json();
}
function download(path,params){
  const q=new URLSearchParams(Object.entries(params).filter(([,v])=>v!==''&&v!=null));
  if(cfg.url==='demo'){Demo.csv(path,q);return}
  q.set('key',cfg.key);window.open(cfg.url.replace(/\/$/,'')+path+'?'+q,'_blank');
}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4200)}
async function guard(fn,btn){if(btn){btn.disabled=true}try{return await fn()}catch(e){toast('⚠ '+e.message)}finally{if(btn)btn.disabled=false}}

/* ---------- مسیریابی ---------- */
let page=store.get('page','overview'),timer=null;
let cache={devices:[],people:[],stats:null};
function renderNav(){$('#nav').innerHTML=PAGES.map(p=>p.sep?'<div class="sep"></div>':
  `<a class="${p.id===page?'on':''}" onclick="go('${p.id}')">${ic(p.i)}<span>${p.t}</span></a>`).join('')}
function go(p){page=p;store.set('page',p);$('#side').classList.remove('open');render()}
async function render(){
  renderNav();const P=PAGES.find(x=>x.id===page)||PAGES[0];$('#title').textContent=P.t;$('#subtitle').textContent=P.s;
  clearInterval(timer);$('#view').innerHTML='<div class="empty">در حال بارگذاری…</div>';
  try{await VIEWS[page]()}catch(e){$('#view').innerHTML=`<div class="card pad"><div class="note err">${esc(e.message)}</div>
    <p class="hint">آدرس سرویس و کلید API را در «تنظیمات اتصال» بررسی کنید.</p><button class="btn" onclick="go('settings')">رفتن به تنظیمات</button></div>`}
}
async function ping(){const c=$('#conn');
  try{const h=cfg.url==='demo'?{driver:'demo'}:await api('/health');
    c.innerHTML=`<span class="dot ${h.driver==='pyzk'?'ok':'warn'}"></span><span>${cfg.url==='demo'?'حالت نمایشی (بدون سرور)':h.driver==='pyzk'?'متصل به سرویس':'سرویس در حالت شبیه‌ساز'}</span>`}

function runsTable(runs,compact){
  if(!runs.length)return'<div class="empty">هنوز تخلیه‌ای انجام نشده</div>';
  const st={ok:['موفق','ok'],skipped:['بدون رکورد جدید','brand'],error:['خطا','err'],running:['در حال اجرا','info']};
  return`<div class="tbl-wrap"><table><tr><th>زمان</th><th>دستگاه</th><th>نوع</th><th>وضعیت</th>
    <th class="num">رکورد دستگاه</th><th class="num">جدید</th>${compact?'':'<th class="num">تکراری (رد شد)</th><th class="num">مدت</th><th>پیام</th>'}</tr>
  ${runs.map(r=>`<tr><td>${jdt(r.started_at)}</td><td>${esc(r.device_name||'—')}</td><td>${r.trigger==='auto'?'خودکار':'دستی'}</td>
    <td><span class="tag ${st[r.status]?.[1]||''}">${st[r.status]?.[0]||r.status}</span></td>
    <td class="num">${fa(r.device_count)}</td><td class="num"><b>${fa(r.inserted)}</b></td>
    ${compact?'':`<td class="num">${fa(r.duplicates)}</td><td class="num">${r.duration_ms!=null?faDigits((r.duration_ms/1000).toFixed(1))+' ث':'—'}</td>
    <td style="white-space:normal;max-width:320px" class="hint">${esc(r.message||'')}</td>`}</tr>`).join('')}</table></div>`;
}

function jHints(){document.querySelectorAll('input[type=date]').forEach(i=>{let h=i.nextElementSibling;

/* ============================================================
   حالت نمایشی (بدون سرور) — فقط برای دیدن رابط کاربری
   ============================================================ */
const Demo=(()=>{
  const now=()=>{const d=new Date();return`${isoD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
  const S={devices:[],att:[],people:[{user_id:'1',name:'نورا مقدس',department:'مالی',active:1},{user_id:'2',name:'کیمیا نصرت‌آبادی',department:'فروش',active:1},
    {user_id:'3',name:'نیلوفر حبیب‌دوست',department:'فروش',active:1},{user_id:'4',name:'محمدرضا انصاری',department:'مدیریت',active:1}],runs:[],audit:[],seq:1,dev:{}};
  function devRecords(id){if(S.dev[id])return S.dev[id];const recs=[];const t=new Date();
    for(let i=20;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);if(d.getDay()===5)continue;
      S.people.forEach((p,k)=>{if((i+k)%9===0)return;const inM=8*60+30+((i*7+k*13)%45),outM=16*60+((i*11+k*17)%80);
        recs.push({user_id:p.user_id,ts:`${isoD(d)} ${pad(Math.floor(inM/60))}:${pad(inM%60)}:00`,punch:0});
        if(!(i===0)&&!((i+k)%11===0))recs.push({user_id:p.user_id,ts:`${isoD(d)} ${pad(Math.floor(outM/60))}:${pad(outM%60)}:00`,punch:1})})}
    return S.dev[id]=recs}
  function sync(d,trigger){const t0=Date.now();const recs=devRecords(d.id);let ins=0;
    recs.forEach(r=>{const k=`${d.id}|${r.user_id}|${r.ts}|${r.punch}`;if(S.att.some(a=>a.key===k))return;ins++;
      S.att.push({id:S.seq++,key:k,device_id:d.id,raw_user_id:r.user_id,raw_ts:r.ts,raw_punch:r.punch,user_id:r.user_id,ts:r.ts,punch:r.punch,note:'',source:'device',is_edited:0,is_deleted:0})});
    Object.assign(d,{last_sync_at:now(),last_success_at:now(),last_status:'ok',last_record_count:recs.length,serial_number:'CKUX20'+(1000+d.id),firmware:'Ver 6.60'});
    const run={id:S.runs.length+1,device_id:d.id,device_name:d.name,trigger,started_at:now(),status:'ok',device_count:recs.length,fetched:recs.length,inserted:ins,duplicates:recs.length-ins,duration_ms:Date.now()-t0+620,message:`${ins} رکورد جدید از ${recs.length} رکورد دستگاه`};
    S.runs.unshift(run);return{...run,status:'ok'}}
  const out=(d)=>({...d,record_total:S.att.filter(a=>a.device_id===d.id).length,running:false,
    next_run_at:d.auto_sync&&d.active?(()=>{const x=new Date((d.last_sync_at||now()).replace(' ','T'));x.setMinutes(x.getMinutes()+d.interval_min);return`${isoD(x)} ${pad(x.getHours())}:${pad(x.getMinutes())}:00`})():null});
  const full=(a)=>({...a,person_name:S.people.find(p=>p.user_id==a.user_id)?.name||'',device_name:S.devices.find(d=>d.id==a.device_id)?.name||''});
  function filt(q){return S.att.filter(a=>{const st=q.get('status')||'active';
    if(st==='deleted'&&!a.is_deleted)return false;if(st==='edited'&&!(a.is_edited&&!a.is_deleted))return false;if(st==='active'&&a.is_deleted)return false;
    if(q.get('date_from')&&a.ts<q.get('date_from'))return false;if(q.get('date_to')&&a.ts>q.get('date_to')+' 23:59:59')return false;
    if(q.get('user_id')&&a.user_id!=q.get('user_id'))return false;if(q.get('device_id')&&a.device_id!=q.get('device_id'))return false;
    if(q.get('source')&&a.source!==q.get('source'))return false;const s=q.get('q');if(s&&!(a.user_id+full(a).person_name+a.note).includes(s))return false;return true}).map(full)}
  function daily(q){const g={};filt(q).sort((a,b)=>a.ts<b.ts?-1:1).forEach(a=>{(g[a.user_id+'|'+a.ts.slice(0,10)]??=[]).push(a)});
    return Object.entries(g).map(([k,it])=>{const[uid,day]=k.split('|');const t=it.map(a=>a.ts.slice(11,16));const m=t.map(x=>+x.slice(0,2)*60+ +x.slice(3));
      let w=0;for(let i=0;i+1<m.length;i+=2)w+=m[i+1]-m[i];return{user_id:uid,name:it[0].person_name,date:day,first_in:t[0],last_out:t.length>1?t[t.length-1]:null,
      punches:it.length,times:t,worked_min:w,standard_min:450,diff_min:w-450,incomplete:t.length%2===1}}).sort((a,b)=>a.date===b.date?a.user_id-b.user_id:a.date<b.date?-1:1)}
  async function handle(path,opt){await new Promise(r=>setTimeout(r,120+Math.random()*200));
    const[p,qs]=path.split('?');const q=new URLSearchParams(qs||'');const m=opt.method||'GET';const b=opt.body||{};let x;
    if(p==='/stats'){const t=isoD(new Date());const a=S.att.filter(z=>!z.is_deleted);
      return{total_records:a.length,today_records:a.filter(z=>z.ts.startsWith(t)).length,today_people:new Set(a.filter(z=>z.ts.startsWith(t)).map(z=>z.user_id)).size,
        devices:S.devices.length,devices_error:S.devices.filter(d=>d.last_status==='error').length,standard_work_min:450}}
    if(p==='/devices'&&m==='GET')return S.devices.map(out);
    if(p==='/devices'&&m==='POST'){const d={id:S.devices.length+1,...b,last_sync_at:null,last_status:null};S.devices.push(d);return out(d)}
    if(p==='/devices/test')return b.ip.startsWith('10.')?{ok:false,error:'timed out — دستگاه در دسترس نیست'}:{ok:true,device_name:'ZKTeco K40',serial_number:'CKUX201001',record_count:420,user_count:4,device_time:now(),latency_ms:84};
    if((x=p.match(/^\/devices\/(\d+)$/))){const d=S.devices.find(z=>z.id==x[1]);if(m==='DELETE'){S.devices=S.devices.filter(z=>z!==d);return{ok:true}}Object.assign(d,b);return out(d)}
    if((x=p.match(/^\/devices\/(\d+)\/sync$/)))return sync(S.devices.find(z=>z.id==x[1]),'manual');
    if((x=p.match(/^\/devices\/(\d+)\/test$/)))return{ok:true,device_name:'ZKTeco K40',record_count:devRecords(+x[1]).length,user_count:4,latency_ms:91};
    if(p==='/sync-all')return S.devices.filter(d=>d.active).map(d=>sync(d,'manual'));
    if(p==='/sync-runs')return S.runs.filter(r=>!q.get('device_id')||r.device_id==q.get('device_id'));
    if(p==='/people'&&m==='GET')return S.people.map(pp=>({...pp,last_ts:S.att.filter(a=>a.user_id==pp.user_id).map(a=>a.ts).sort().pop()}));
    if((x=p.match(/^\/people\/(.+)$/))){const pp=S.people.find(z=>z.user_id==decodeURIComponent(x[1]));Object.assign(pp,b);return pp}
    if(p==='/attendance'&&m==='GET'){const all=filt(q).sort((a,b)=>a.ts<b.ts?1:-1);const ps=+q.get('page_size')||50,pg=+q.get('page')||1;return{total:all.length,items:all.slice((pg-1)*ps,pg*ps)}}
    if(p==='/attendance'&&m==='POST'){const a={id:S.seq++,device_id:null,...b,ts:b.ts+':00',source:'manual',is_edited:0,is_deleted:0};S.att.push(a);S.audit.push({attendance_id:a.id,action:'manual_add',actor:cfg.user||'dashboard',at:now()});return full(a)}
    if((x=p.match(/^\/attendance\/(\d+)(?:\/(\w+))?$/))){const a=S.att.find(z=>z.id==x[1]);const act=x[2];
      if(act==='history')return S.audit.filter(h=>h.attendance_id==a.id).slice().reverse();
      const log=(action,before)=>S.audit.push({attendance_id:a.id,action,actor:cfg.user||'dashboard',at:now(),before_json:before?JSON.stringify(before):null});
      if(m==='DELETE'){a.is_deleted=1;log('delete');return{ok:true}}
      if(act==='restore'){a.is_deleted=0;log('restore');return full(a)}
      if(act==='revert'){log('revert',{ts:a.ts});Object.assign(a,{ts:a.raw_ts,user_id:a.raw_user_id,punch:a.raw_punch,is_edited:0});return full(a)}
      if(m==='PUT'){log('edit',{ts:a.ts,user_id:a.user_id,punch:a.punch});Object.assign(a,b,{ts:b.ts.length===16?b.ts+':00':b.ts,is_edited:1});return full(a)}}
    if(p==='/reports/daily')return daily(q);
    if(p==='/reports/summary'){const ag={};daily(q).forEach(d=>{const a=ag[d.user_id]??={user_id:d.user_id,name:d.name,days:0,worked_min:0,shortfall_min:0,overtime_min:0,incomplete_days:0};
      a.days++;a.worked_min+=d.worked_min;if(d.incomplete)a.incomplete_days++;else if(d.diff_min<0)a.shortfall_min-=d.diff_min;else a.overtime_min+=d.diff_min});
      return Object.values(ag).map(a=>({...a,avg_min:Math.floor(a.worked_min/a.days)}))}
    throw new Error('مسیر نمایشی پیدا نشد: '+p)}
  function csv(path,q){let rows;if(path.includes('daily'))rows=[['تاریخ','کد','نام','ورود','خروج','کارکرد']].concat(daily(q).map(d=>[jdate(d.date),d.user_id,d.name,d.first_in,d.last_out||'',hm(d.worked_min)]));
    else if(path.includes('summary'))rows=[['کد','نام','روز','کارکرد']];else rows=[['کد','نام','زمان','نوع']].concat(filt(q).map(a=>[a.user_id,a.person_name,a.ts,PUNCH[a.punch]]));
    const blob=new Blob(['﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=path.split('/').pop();l.click()}
  return{handle,csv};
})();

/* ---------- شروع ---------- */
(async()=>{ping();setInterval(ping,60000);try{cache.stats=await api('/stats')}catch(e){}render()})();
</script>
