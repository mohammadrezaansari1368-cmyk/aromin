# داخل بلوک server مربوط به dashboard.arominco.com اضافه کنید
# تا صفحه داشبورد با آدرس /zk-api/ به سرویس دسترسی داشته باشد (بدون مشکل CORS و HTTPS)
location /zk-api/ {
    proxy_pass http://127.0.0.1:8470/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;   # تخلیه دستی دستگاه‌های پر رکورد ممکن است طول بکشد
}
