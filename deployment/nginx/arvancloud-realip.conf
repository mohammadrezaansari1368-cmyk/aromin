# Real visitor IP behind ArvanCloud CDN  →  /etc/nginx/conf.d/arvancloud-realip.conf  (http context)
#
# Sources (official ArvanCloud):
#   - Header name: "To provide the client (visitor) IP address for every request to the origin, ArvanCloud adds the
#     “ar-real-ip” header."  — https://github.com/arvancloud/ar-ngxrealip (ArvanCloud's own GitHub organization)
#   - IP ranges: https://www.arvancloud.ir/fa/ips.txt  (fetched 2026-10-22; 14 IPv4 ranges, no IPv6 published)
#
# Effect: only when the TCP peer is an ArvanCloud edge, nginx replaces $remote_addr with ar-real-ip. Anyone hitting the
# origin directly (not via ArvanCloud) cannot spoof it. proxy_params then sends X-Real-IP $remote_addr = the visitor.
# Re-check ips.txt periodically; a new ArvanCloud range missing here only means those visitors show as the edge IP.

set_real_ip_from 185.143.232.0/22;
set_real_ip_from 188.229.116.16/30;
set_real_ip_from 94.101.182.0/27;
set_real_ip_from 2.144.3.128/28;
set_real_ip_from 37.32.16.0/27;
set_real_ip_from 37.32.17.0/27;
set_real_ip_from 37.32.18.0/27;
set_real_ip_from 37.32.19.0/27;
set_real_ip_from 185.215.232.0/22;
set_real_ip_from 178.131.120.48/28;
set_real_ip_from 94.101.183.0/28;
set_real_ip_from 78.157.36.112/28;
set_real_ip_from 95.38.61.80/28;
set_real_ip_from 193.24.119.0/29;

real_ip_header ar-real-ip;
real_ip_recursive off;
