name: Docker and durable queue
on:
  push:
    branches: [feat/docker-durable-jobs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-only
          MARIADB_DATABASE: aromin_dev
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: synthetic-ci-only
      DB_NAME: aromin_dev
      AROMIN_BACKGROUND_ENABLED: '0'
      AROMIN_QUEUE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/cloud/requirements.lock httpx Pillow==11.3.0 arabic-reshaper==3.0.0 python-bidi==0.6.6 tzdata
      - run: python deployment/migrate.py
      - run: python -m unittest discover -s deployment/tests -p 'test_job*.py' -v
      - run: python -m unittest discover -s deployment/tests -p 'test_performance*.py' -v
      - run: python -m unittest discover -s deployment/tests -p 'test_tickets.py' -v
      - run: python -m unittest discover -s deployment/tests -p 'test_calls.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run --maxWorkers=2
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python ops/docker/prepare_secrets.py --fresh
      - run: docker compose config --quiet
      - run: docker compose build api
      - run: docker compose up -d --wait api worker
      - run: curl --fail http://127.0.0.1:3100/api/health
      - if: always()
        run: docker compose logs --tail 100
